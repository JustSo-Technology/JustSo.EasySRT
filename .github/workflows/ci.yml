name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q
      - name: Audit locked backend dependencies
        working-directory: backend
        run: uv audit --frozen

  frontend:
    strategy:
      matrix:
        node: ["22.13.0", "22"]
    name: frontend-${{ matrix.node }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.17.1"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Build and type-check
        working-directory: frontend
        run: pnpm build
      - name: Audit frontend dependencies including build tools
        working-directory: frontend
        run: pnpm audit --audit-level=low

  frontend-required:
    name: frontend
    if: always()
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.frontend.result }}" = success

  operations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate shell scripts
        run: |
          for script in ops/*.sh tools/*.sh; do bash -n "$script"; done
          shellcheck ops/*.sh tools/*.sh
      - name: Compile operation helpers
        run: python3 -m py_compile ops/*.py
      - name: Test deployment prerequisites and locked installation
        run: python3 -m unittest discover -s ops -p 'test_*.py' -v
      - name: Validate candidate release metadata
        run: bash tools/release-check.sh "v$(node -p "require('./frontend/package.json').version")"

  media-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install the Ubuntu media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked backend dependencies
        run: uv sync --project backend --locked
      - name: Prove independent media signals
        run: python3 ops/validate-telemetry.py --report /tmp/easysrt-telemetry.json
      - name: Exercise real media faults and recovery
        run: uv run --project backend python ops/validate-recovery.py --report /tmp/easysrt-recovery.json
      - name: Check shipping timeout defaults
        run: uv run --project backend python ops/validate-recovery.py --defaults --fault input_stall --report /tmp/easysrt-defaults.json
      - name: Exercise isolated systemd and helper controls
        run: uv run --project backend python ops/validate-service-recovery.py --report /tmp/easysrt-service-recovery.json

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose --no-banner /repo
