[project]
name = "justso-easysrt-backend"
version = "0.1.0a1"
description = "Backend for JustSo.EasySRT"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.10.1",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
